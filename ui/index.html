<!DOCTYPE html>
<!--
  JARVIS · 认知界面
  中央形象 = ⑤星云团簇，但语义已升级为「双星核心 + 五星系」：
    中心双星 = 你 + 贾维斯
    五星系   = 人物 / 地点 / 事件 / 兴趣 / 项目
    星座     = 一个实体（来自 entities 表）
    节点     = 一条记忆（来自 memories 表）
    激活扩散 = 真实检索命中（不是随机）
  真 3D：透视 + 深度 + 自转 + 拖动旋转
-->
<html lang="zh-CN"><head><meta charset="utf-8"><title>JARVIS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b11; --panel:rgba(16,24,36,.62); --line:rgba(150,175,215,.16);
  --txt:#e8eef6; --dim:#8492a4; --faint:#5b6675; --warm:#ff9f1c; --cool:#4f8cff;
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);overflow:hidden;
  font:12px/1.65 "Microsoft YaHei",system-ui,sans-serif}
/* 扫描线 + 暗角 */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9;
  background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(0,0,0,.55) 100%)}

/* 星图舞台：用一个普通 div 定位，canvas 填满它。
   为什么要包一层：canvas 是替换元素，JS 设了 cv.width=1297（DPR2 缓冲尺寸）后，
   浏览器把 1297/2=649px 当成它的固有 CSS 宽度，position+left/right 撑出的盒子
   会被这个固有尺寸覆盖 → 画布缩到 649px 且偏左 83px。这是"位置不对"的真正原因。
   包一层 div 定位、canvas 用 width/height:100% 填充，布局与缓冲尺寸就彻底解耦。 */
/* 星图舞台：用 div 定位，canvas 填满它。
   为什么包一层：canvas 是替换元素，JS 设了 cv.width（DPR 缩放缓冲尺寸）后，
   浏览器把属性值/DPR 当固有 CSS 宽度，position+left/right 撑出的盒子被覆盖
   → 画布缩成 649px 且偏左 83px。这就是"位置不对"的真正原因。
   包一层 div 定位、canvas 用 100% 填充，布局与缓冲尺寸彻底解耦。 */
#stage{position:fixed;left:220px;right:220px;top:42px;height:46%;z-index:0;
  pointer-events:auto;
  background:radial-gradient(ellipse at 50% 50%,rgba(79,140,255,.05) 0%,transparent 62%)}
#graph{display:block;width:100%;height:100%}

/* 顶栏 */
#top{position:fixed;left:0;right:0;top:0;height:34px;z-index:5;
  display:flex;align-items:center;gap:12px;padding:0 12px;
  background:rgba(9,14,21,.80);border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px)}
#top .brand{font-size:12px;font-weight:800;letter-spacing:2.2px;color:var(--warm)}
#top .st{font-size:9.5px;letter-spacing:1.4px;color:var(--dim);
  padding:1px 7px;border:1px solid var(--line);border-radius:4px}
#top .sp{flex:1}
#top .m{font-size:9.5px;color:var(--faint)}
#wave{width:52px;height:14px}

/* 浮动面板 */
.panel{position:fixed;top:42px;bottom:60px;width:196px;z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(18px);overflow:hidden;display:flex;flex-direction:column}
#pl{left:12px} #pr{right:12px}
.ph{padding:7px 11px;font-size:9px;font-weight:700;letter-spacing:1.5px;
  color:var(--warm);border-bottom:1px solid var(--line);flex-shrink:0}
.pb{flex:1;overflow-y:auto;padding:8px 11px}
.pb::-webkit-scrollbar{width:4px}
.pb::-webkit-scrollbar-thumb{background:rgba(150,175,215,.22);border-radius:2px}

/* 对话区在星图下方。
   顶部留 10px 间隙并加渐变遮罩：不留的话滚动中的气泡会正好卡在
   舞台与对话区的接缝处露出半截（实测截图里"A股量化交易"被切一半）。 */
#chat{position:fixed;left:220px;right:220px;top:calc(42px + 46% + 10px);bottom:60px;z-index:3;
  overflow-y:auto;padding:10px 16px 10px;display:flex;flex-direction:column;gap:9px;
  mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 100%)}
#chat::-webkit-scrollbar{width:4px}
#chat::-webkit-scrollbar-thumb{background:rgba(150,175,215,.20);border-radius:2px}
.msg{max-width:88%;padding:7px 11px;border-radius:10px;font-size:12px;
  white-space:pre-wrap;word-break:break-word;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-end;background:rgba(79,140,255,.15);
  border:1px solid rgba(79,140,255,.34)}
.msg.a{align-self:flex-start;background:rgba(20,30,44,.78);border:1px solid var(--line)}
.msg.e{align-self:center;background:rgba(255,90,90,.12);
  border:1px solid rgba(255,90,90,.4);color:#ffb0b0;font-size:11px}
.msg .lbl{font-size:8.5px;letter-spacing:1.2px;color:var(--faint);
  display:block;margin-bottom:2px}

/* 工具调用气泡：比普通消息更窄更淡，是"过程"不是"内容" */
.msg.t{align-self:flex-start;background:rgba(16,24,36,.6);
  border:1px solid rgba(120,160,220,.22);color:#9fb6d4;
  font-size:11px;padding:5px 10px;max-width:70%;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.msg.t .lbl{color:#6d8cb0;display:inline;margin:0}
/* 调用中：左侧一道扫描线表示"正在跑" */
.msg.t::before{content:'';width:2px;height:12px;border-radius:1px;
  background:#4f8cff;opacity:.85;animation:tscan 1.05s ease-in-out infinite}
@keyframes tscan{0%,100%{opacity:.25;transform:scaleY(.5)}50%{opacity:1;transform:scaleY(1)}}
/* 已完成就停止动画 */
.msg.t.tok::before,.msg.t.terr::before{animation:none}
.msg.t.tok::before{background:#4ad991;opacity:1}
.msg.t.terr::before{background:#ff6b6b;opacity:1}
.msg.t .targs{font-family:Consolas,monospace;font-size:10px;color:#7d97b8;
  background:rgba(0,0,0,.25);padding:1px 5px;border-radius:3px}
.msg.t .tres{font-size:9.5px;letter-spacing:.5px;margin-left:auto;color:#6d8cb0}
.msg.t.tok .tres{color:#4ad991}
.msg.t.terr .tres{color:#ff8a8a}

/* 底部输入 */
#bottom{position:fixed;left:12px;right:12px;bottom:12px;height:38px;z-index:6;
  display:flex;gap:8px;align-items:center;
  background:rgba(12,18,27,.88);border:1px solid var(--line);
  border-radius:10px;padding:0 10px;backdrop-filter:blur(18px)}
#inp{flex:1;background:none;border:none;outline:none;color:var(--txt);
  font:12px "Microsoft YaHei",sans-serif}
#inp::placeholder{color:var(--faint)}
#send{background:rgba(255,159,28,.18);border:1px solid var(--warm);color:#ffbe6b;
  font-size:10.5px;padding:3px 13px;border-radius:6px;cursor:pointer}
#send:hover{background:rgba(255,159,28,.3)}
#send:disabled{opacity:.4;cursor:default}

/* 语音按钮：图标式，激活时用颜色+呼吸表示状态 */
#mic,#spk{background:none;border:1px solid var(--line);color:var(--faint);
  font-size:13px;line-height:1;padding:4px 7px;border-radius:6px;cursor:pointer;
  transition:color .18s,border-color .18s,background .18s}
#mic:hover,#spk:hover{color:var(--txt);border-color:var(--dim)}
/* 麦克风常听中：蓝色呼吸 */
#mic.on{color:#7fb4ff;border-color:rgba(79,140,255,.55);
  background:rgba(79,140,255,.12);animation:micPulse 2.1s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(79,140,255,.30)}
  50%{box-shadow:0 0 0 4px rgba(79,140,255,0)}}
/* 已唤醒、正在听指令：橙色高亮 */
#mic.awake{color:#ffbe6b;border-color:var(--warm);
  background:rgba(255,159,28,.18);animation:micPulse .9s ease-in-out infinite}
/* 朗读开启 */
#spk.on{color:#ffbe6b;border-color:var(--warm);background:rgba(255,159,28,.14)}

/* 记忆条目 */
.it{font-size:10.5px;padding:5px 7px;margin-bottom:5px;border-radius:6px;
  background:rgba(30,42,60,.5);border-left:2px solid var(--cool);color:#c3ceda}
.it .meta{font-size:8.5px;color:var(--faint);margin-top:2px}
.it.hot{border-left-color:var(--warm);background:rgba(255,159,28,.10)}
.gal{font-size:9.5px;color:var(--dim);display:flex;justify-content:space-between;
  padding:3px 0;border-bottom:1px solid rgba(150,175,215,.07)}
.gal b{color:var(--txt);font-weight:600}
.empty{font-size:10px;color:var(--faint);text-align:center;padding:16px 4px;line-height:1.9}

/* ── 五轴意识状态条 ── */
#mindbox{padding:7px 11px 9px;flex-shrink:0}
.ax{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:9.5px}
.ax .n{width:22px;color:var(--dim);flex-shrink:0}.ax .bar{flex:1;height:3px;background:rgba(150,175,215,.10);border-radius:2px;
  position:relative;overflow:hidden}
/* 双极轴（-1~1）零点在中间，用一条竖线标出 */
.ax .bar.bi::before{content:'';position:absolute;left:50%;top:-1px;bottom:-1px;
  width:1px;background:rgba(150,175,215,.22)}
.ax .fill{position:absolute;top:0;bottom:0;border-radius:2px;
  transition:left .5s ease,width .5s ease,background .5s ease}
.ax .v{width:34px;text-align:right;color:var(--faint);
  font-variant-numeric:tabular-nums;flex-shrink:0}
#mood{color:var(--txt);font-weight:400;letter-spacing:0;margin-left:4px}
/* 主动消息气泡：和普通回复区分开，用暖色左边框 */
.msg.pro{border-left:2px solid var(--warm);background:rgba(255,159,28,.055)}
.msg.pro .lbl{color:var(--warm)}

/* 巡视发现的条目：按严重度标色 */
.pfind{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.pfrow{font-size:11px;padding:3px 8px;border-radius:4px;border-left:2px solid transparent;
  background:rgba(0,0,0,.22);color:#b8c6d8}
.pfrow.sev-high{border-left-color:#ff6b6b;color:#ffc4c4;background:rgba(255,90,90,.1)}
.pfrow.sev-medium{border-left-color:var(--warm);color:#ffd9a8;background:rgba(255,159,28,.08)}
.pfrow.sev-low{border-left-color:#4a5a72}
/* 贾维斯自己在干活时的提示 */
#doing{position:fixed;left:50%;transform:translateX(-50%);
  top:calc(42px + 46% - 26px);z-index:4;
  font-size:9.5px;letter-spacing:.6px;color:var(--warm);opacity:0;
  transition:opacity .6s ease;pointer-events:none;
  background:rgba(10,14,22,.72);padding:3px 10px;border-radius:9px;
  border:1px solid rgba(255,159,28,.22)}
#doing.on{opacity:.9}

/* ── 星图图例 ──
   色相现在承载语义（新鲜/正常/变淡/实体/合并过），
   但用户不知道颜色代表什么就等于没做。放舞台左下角，克制不抢戏。 */
#legend{position:absolute;left:14px;bottom:12px;z-index:6;
  font-size:10.5px;line-height:1.75;letter-spacing:.04em;
  color:rgba(190,208,232,.60);pointer-events:none;user-select:none}
#legend .lg-t{font-size:9.5px;color:rgba(150,172,204,.5);
  letter-spacing:.16em;margin-bottom:3px}
#legend .lg-r{display:flex;align-items:center;gap:6px}
#legend .lg-d{width:7px;height:7px;border-radius:50%;flex:none;
  box-shadow:0 0 6px currentColor;background:currentColor}
/* 颜色严格对应着色器 nodeHue 的输出值（实测校准）：
   event 0.093 / place ~0.13 / interest 0.229 / project 0.292 / person 0.362
   着色器在 hue<0.35 时插值 fade(0.42,0.55,0.92) → fresh(0.44,0.93,0.74) */
#legend .lg-d.c-person {color:#71ecbb}   /* hue 0.36 → 接近 fresh 绿 */
#legend .lg-d.c-project{color:#68d3c4}   /* hue 0.29 */
#legend .lg-d.c-interest{color:#5fbcd0}  /* hue 0.23 */
#legend .lg-d.c-place  {color:#57a5da}   /* hue 0.13 */
#legend .lg-d.c-event  {color:#5090e2}   /* hue 0.09 → 接近 fade 蓝 */
#legend .lg-d.c-ent    {color:#ffbd57}   /* 实体 hue 0.60 琥珀 */
#legend .lg-d.c-fade   {color:#6b8cea}   /* retention<0.6 → hue 0.02 冷蓝 */
#legend .lg-d.c-ring   {color:#ffd9a0;box-shadow:0 0 0 2px rgba(255,217,160,.42),0 0 8px currentColor}

/* ── 记忆详情卡 ──
   点击星图节点弹出。星图之前是纯展示，一堆匿名光点点了没反应。 */
#memcard{position:fixed;z-index:12;width:286px;max-width:calc(100vw - 24px);
  background:rgba(11,17,26,.94);border:1px solid rgba(150,175,215,.26);
  border-radius:12px;backdrop-filter:blur(10px);
  box-shadow:0 10px 34px rgba(0,0,0,.6);
  opacity:0;transform:translateY(5px) scale(.97);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease}
#memcard.on{opacity:1;transform:none;pointer-events:auto}
.mc-h{display:flex;align-items:center;gap:7px;padding:8px 10px;
  border-bottom:1px solid var(--line)}
.mc-cat{font-size:9px;letter-spacing:1.1px;color:var(--warm);
  border:1px solid rgba(255,159,28,.3);border-radius:4px;padding:1px 6px}
.mc-id{font-size:9px;color:var(--faint);letter-spacing:.5px}
.mc-x{margin-left:auto;color:var(--faint);cursor:pointer;font-size:11px;
  line-height:1;padding:2px 3px;border-radius:4px}
.mc-x:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.mc-body{padding:9px 10px 11px}
.mc-txt{font-size:11.5px;line-height:1.62;color:var(--txt);margin-bottom:9px;
  word-break:break-word}
.mc-meta{display:flex;flex-wrap:wrap;gap:4px 5px;margin-bottom:8px}
.mc-tag{font-size:8.5px;letter-spacing:.5px;color:var(--dim);
  border:1px solid var(--line);border-radius:4px;padding:1.5px 5px;white-space:nowrap}
.mc-tag b{color:var(--txt);font-weight:600}
/* 衰减状态：三档一眼可辨 */
.mc-tag.fresh {border-color:rgba(80,220,150,.36);color:#7fe3b0}
.mc-tag.normal{border-color:rgba(140,170,220,.32);color:#9db4d6}
.mc-tag.fading{border-color:rgba(255,140,90,.36);color:#ffb08a}
/* 强度条 */
.mc-bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;
  overflow:hidden;margin-bottom:3px}
.mc-bar i{display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--cool),var(--warm))}
.mc-cap{font-size:8.5px;color:var(--faint);letter-spacing:.4px;margin-bottom:8px}
/* 合并历史 */
.mc-merge{margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.mc-mh{font-size:8.5px;letter-spacing:1px;color:var(--warm);margin-bottom:6px}
.mc-mrow{font-size:9.5px;line-height:1.5;color:var(--dim);
  padding:5px 7px;margin-bottom:4px;border-radius:6px;
  background:rgba(255,255,255,.035);border-left:2px solid rgba(255,159,28,.4)}
.mc-mrow .d{color:var(--faint);text-decoration:line-through}
.mc-mrow .w{color:var(--faint);font-size:8.5px;display:block;margin-top:2px}
.mc-empty{font-size:9.5px;color:var(--faint)}

/* ── 顶栏数据源健康灯 ──
   3 个关键数据源（腾讯行情 / 东财板块 / 资金流）的状态原来完全不上界面。
   东财实测会被 IP 风控（连续 socket hang up），一挂用户毫无察觉，
   只会觉得"贾维斯今天答得不对" —— 而错的行情比没有行情更危险。 */
#srcs{display:inline-flex;align-items:center;gap:5px;margin:0 5px;cursor:default}
#srcs .s{width:6px;height:6px;border-radius:50%;flex:none;
  background:#3a4658;transition:background .3s,box-shadow .3s}
#srcs .s.ok  {background:#3fd48a;box-shadow:0 0 5px rgba(63,212,138,.7)}
#srcs .s.deg {background:#ff9f1c;box-shadow:0 0 5px rgba(255,159,28,.7)}
#srcs .s.down{background:#ff5c5c;box-shadow:0 0 6px rgba(255,92,92,.85)}
/* 关键源挂掉时呼吸闪烁 —— 这种情况必须被看见，不能安静地错 */
#srcs .s.down.crit{animation:srcAlarm 1.1s ease-in-out infinite}
@keyframes srcAlarm{0%,100%{opacity:1}50%{opacity:.32}}
</style></head><body>

<div id="stage"><canvas id="graph"></canvas>
  <!-- 图例：颜色有含义但用户不知道就等于没做。
       注意色相表达的是**类别**而非新鲜度 —— 实测所有记忆都还是 fresh，
       按新鲜度上色会退化成一种颜色。图例必须说真话。 -->
  <div id="legend">
    <div class="lg-t">记忆类别</div>
    <div class="lg-r"><i class="lg-d c-person"></i>人物</div>
    <div class="lg-r"><i class="lg-d c-project"></i>项目</div>
    <div class="lg-r"><i class="lg-d c-interest"></i>兴趣</div>
    <div class="lg-r"><i class="lg-d c-place"></i>地点</div>
    <div class="lg-r"><i class="lg-d c-event"></i>事件</div>
    <div class="lg-t" style="margin-top:6px">其他</div>
    <div class="lg-r"><i class="lg-d c-ent"></i>实体骨架</div>
    <div class="lg-r"><i class="lg-d c-fade"></i>已褪色</div>
    <div class="lg-r"><i class="lg-d c-ring"></i>合并过</div>
  </div>
</div>

<!-- 记忆详情卡：点击星图节点时弹出。
     用悬浮卡而不是固定面板，因为左右两栏已经占满，
     再加固定面板会把星图挤成一条缝。 -->
<div id="memcard">
  <div class="mc-h">
    <span class="mc-cat" id="mc-cat">—</span>
    <span class="mc-id" id="mc-id"></span>
    <span class="mc-x" id="mc-x">✕</span>
  </div>
  <div class="mc-body" id="mc-body"></div>
</div>

<div id="top">
  <span class="brand">J.A.R.V.I.S</span>
  <span class="st" id="state">IDLE</span>
  <canvas id="wave"></canvas>
  <span class="sp"></span>
  <span class="m" id="mesh">CLUSTER</span>
  <!-- 数据源健康灯：3 个关键源的状态原来界面上完全看不到，
       东财被封（实测会 socket hang up）时用户毫无察觉，
       只会觉得"贾维斯今天答得不对"。 -->
  <span class="srcs" id="srcs" title="数据源状态"></span>
  <span class="m" id="meta">—</span>
</div>

<div class="panel" id="pl">
  <div class="ph">五星系 · GALAXIES</div>
  <div class="pb" id="galaxies"></div>
  <div class="ph" style="border-top:1px solid var(--line)">意识状态 · MIND <span id="mood"></span></div>
  <div id="mindbox"></div>
</div>

<div id="chat"></div>
<div id="doing"></div>

<div class="panel" id="pr">
  <div class="ph">本轮召回 · RECALL</div>
  <div class="pb" id="recall"><div class="empty">尚无检索</div></div>
</div>

<div id="bottom">
  <button id="mic" title="语音输入（唤醒词：贾维斯）">🎙</button>
  <input id="inp" placeholder="对贾维斯说…（Enter 发送）" autocomplete="off">
  <button id="spk" title="朗读回复">🔊</button>
  <button id="send">发送</button>
</div>

<script src="/pickmath.js"></script>
<script src="/starfield.js"></script>
<script src="/app.js"></script>
</body></html>
